name: Build and Deploy Website to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: 📦 Install dependencies & Build Project
      run: |
        npm install
        npm run build       # This creates a folder (usually named 'dist' or 'build')

    - name: 📂 Sync Compiled Files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/                  # CHANGE THIS to ./build/ if using older React
        server-dir: ./htdocs/
